name: vidtele_mobile
description: "Application mobile de streaming vidéo privé depuis Telegram façon Netflix."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestion d'état moderne
  flutter_riverpod: ^2.5.1

  # Réseau HTTP & Intercepteurs JWT
  dio: ^5.4.3+1

  # Stockage sécurisé des tokens & préférences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Lecteur vidéo & Contrôles personnalisés
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Cache d'images pour les miniatures
  cached_network_image: ^3.3.1

  # Internationalisation & Dates
  intl: ^0.20.3

  # Lancement d'URLs et téléchargement APK
  url_launcher: ^6.3.0

  # Icônes modernes
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.5.2
  audio_session: ^0.2.4
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
