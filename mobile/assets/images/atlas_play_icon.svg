<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond sombre & vibrant -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1B1E38" />
      <stop offset="60%" stop-color="#0B0E1E" />
      <stop offset="100%" stop-color="#05070F" />
    </radialGradient>

    <!-- Dégradé Montagnes Atlas (Rouge Cinéma vers Carmin Profond) -->
    <linearGradient id="atlasGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="atlasGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990008" />
    </linearGradient>

    <!-- Dégradé Play Icon & Or Sommet -->
    <linearGradient id="goldPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Filtres d'ombre cinématographique et lueur -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E50914" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Arrière-plan arrondi élégant -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Couronnes & Sommets de l'Atlas en arrière-plan (stylisés) -->
  <path d="M 140 370 L 256 165 L 372 370 Z" fill="url(#atlasGradBack)" opacity="0.35" />

  <!-- Pics Montagneux Atlas principaux (Forme de 'A' comme Atlas) -->
  <g filter="url(#dropShadow)">
    <!-- Montagne gauche / crête -->
    <path d="M 80 390 L 256 110 L 320 220 L 256 330 L 160 390 Z" fill="url(#atlasGradFront)" />
    <!-- Montagne droite / ombre projetée -->
    <path d="M 256 110 L 432 390 L 310 390 L 256 295 Z" fill="#B91C1C" />
  </g>

  <!-- Sommet enneigé / Doré éclatant façon Mont Toubkal (Atlas) -->
  <path d="M 256 110 L 285 160 L 265 152 L 256 165 L 247 152 L 227 160 Z" fill="url(#goldPeak)" />

  <!-- Bouton Play Cinématographique au cœur du sommet (Atlas + Play) -->
  <g transform="translate(256, 275)" filter="url(#neonGlow)">
    <!-- Disque sombre transparent -->
    <circle r="68" fill="rgba(11, 14, 30, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />
    <!-- Triangle Play parfait centré -->
    <polygon points="-16,-34 36,0 -16,34" fill="url(#playGrad)" />
  </g>

  <!-- Petites étoiles / Constellation du Nord pour la touche premium -->
  <circle cx="120" cy="110" r="3" fill="#F8FAFC" opacity="0.6" />
  <circle cx="390" cy="130" r="3.5" fill="#FDE047" opacity="0.8" />
  <circle cx="415" cy="95" r="2.5" fill="#F8FAFC" opacity="0.5" />
  <circle cx="95" cy="160" r="2" fill="#F8FAFC" opacity="0.4" />
</svg>
