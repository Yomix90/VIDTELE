version: '3.8'

# Configuration spécifique pour Dokploy avec le réseau Traefik (dokploy-network)
# Utilisez ce fichier si vous souhaitez que Dokploy route directement via son reverse proxy Traefik interne
# sans exposer de port public sur le VPS.

services:
  vidtele:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidtele-backend:latest
    container_name: vidtele-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      # Sécurité et Jetons JWT
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - STREAM_TOKEN_EXPIRE_SECONDS=${STREAM_TOKEN_EXPIRE_SECONDS:-7200}

      # Base de données
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/vidtele.db}

      # Telegram MTProto
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION_NAME=${TELEGRAM_SESSION_NAME:-/app/data/vidtele_session}
      - TELEGRAM_STRING_SESSION=${TELEGRAM_STRING_SESSION:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}

      # Stockage et Cache Disque
      - CACHE_DIR=${CACHE_DIR:-/app/cache}
      - THUMBNAILS_DIR=${THUMBNAILS_DIR:-/app/thumbnails}
      - MAX_CACHE_GB=${MAX_CACHE_GB:-20.0}

      # Limites et Concurrence
      - MAX_CONCURRENT_STREAMS_PER_USER=${MAX_CONCURRENT_STREAMS_PER_USER:-2}
      - MAX_CONCURRENT_STREAMS_GLOBAL=${MAX_CONCURRENT_STREAMS_GLOBAL:-30}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}

      # Compte Administrateur Initial
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-AdminSecurePass2026!}
    volumes:
      - vidtele_data:/app/data
      - vidtele_cache:/app/cache
      - vidtele_thumbnails:/app/thumbnails
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network
      - default

volumes:
  vidtele_data:
  vidtele_cache:
  vidtele_thumbnails:

networks:
  dokploy-network:
    external: true
  default:
