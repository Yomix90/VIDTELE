# Configuration Alembic (migrations versionnées de la base).
# L'URL de la base vient de DATABASE_URL (voir migrations/env.py), jamais de ce fichier.
#
# Commandes utiles (depuis backend/) :
#   python -m alembic current                  # révision appliquée
#   python -m alembic history                  # liste des migrations
#   python -m alembic revision --autogenerate -m "description"
#   python -m alembic upgrade head             # (fait automatiquement au démarrage)
#   python -m alembic downgrade -1             # retour arrière d'une migration

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
