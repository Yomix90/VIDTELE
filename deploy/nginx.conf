# Configuration Nginx Haute Performance pour VidTele
# Reverse Proxy avec gestion optimisée du streaming HTTP 206 (Range Requests)

upstream vidtele_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name vidtele.votre-domaine.com;

    # Redirection automatique HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vidtele.votre-domaine.com;

    # Certificats SSL Let's Encrypt (générés via certbot)
    ssl_certificate /etc/letsencrypt/live/vidtele.votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidtele.votre-domaine.com/privkey.pem;

    # Sécurité SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tailles de corps et buffers
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Compression GZIP pour les données textuelles / JSON (exclut expressément la vidéo)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_disable "msie6";

    # Logs d'accès et d'erreurs
    access_log /var/log/nginx/vidtele_access.log combined buffer=64k flush=5m;
    error_log /var/log/nginx/vidtele_error.log warn;

    # 1. OPTIMISATION CRITIQUE : Streaming Vidéo HTTP 206 partiel
    # Désactivation formelle du buffering proxy pour un transfert direct des octets en temps réel
    location ~* ^/api/videos/[0-9]+/stream {
        proxy_pass http://vidtele_backend;
        proxy_http_version 1.1;

        # IMPORTANT : proxy_buffering OFF évite que Nginx bloque la vidéo dans sa RAM
        proxy_buffering off;
        proxy_request_buffering off;

        # Transmission intacte des en-têtes de Range HTTP
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";

        # En-têtes standards d'identification de client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts allongés pour les longues sessions de visionnage
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # En-têtes spécifiques au streaming vidéo
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. Miniatures statiques mises en cache par le navigateur
    location ~* ^/api/videos/[0-9]+/thumbnail {
        proxy_pass http://vidtele_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache navigateur 7 jours pour les miniatures
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 3. Toutes les autres routes (API REST, Auth, Dashboard Web)
    location / {
        proxy_pass http://vidtele_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
